<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EXTERIOR MLBB TOURNAMENT</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style id="css">
:root{color-scheme:dark;box-sizing:border-box;--bg:#07070c;--surface:#13131b;--ink:#f5f5fa;--muted:#9a9ab2;--line:#2b2b3b;--accent:#ff2e4d;--gold:#ffc83d;--goldbg:rgba(255,200,61,.14);--onaccent:#fff;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;color:var(--ink);font-family:"Chakra Petch",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45;background-color:#07070c;background-attachment:fixed;background:
 linear-gradient(115deg,rgba(255,46,77,.22) 0,rgba(255,46,77,0) 38%),
 linear-gradient(295deg,rgba(255,200,61,.14) 0,rgba(255,200,61,0) 34%),
 repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 40px),
 repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 40px),
 #07070c}
main{max-width:1100px;margin:0 auto;padding:24px 16px 44px}
h1{font-size:clamp(1.7rem,4.6vw,2.8rem);margin:0 0 6px;font-weight:700;font-style:italic;text-transform:uppercase;letter-spacing:.05em;padding-left:14px;border-left:6px solid var(--accent);text-shadow:0 0 30px rgba(255,46,77,.45)}
.sub{color:var(--muted);margin:0 0 22px;padding-left:20px;letter-spacing:.04em}
details{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:20px}
summary{cursor:pointer;font-weight:600}
.seeds{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin:12px 0}
.seed{display:flex;align-items:center;gap:8px}
.seed b{width:26px;text-align:right;color:var(--muted);font-weight:600}
.seed input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
.seed input:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
button{font:inherit;font-weight:600;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:4px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
.note{color:var(--muted);font-size:.9rem;margin:10px 0 0}
.scroll{overflow-x:auto;padding-bottom:8px}
.bracket{display:flex;gap:20px;min-width:960px;height:600px}
.col{flex:1;display:flex;flex-direction:column;min-width:180px}
.col h2{font-size:.8rem;margin:0 0 10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.18em;padding-bottom:6px;border-bottom:2px solid var(--accent)}
.matches{flex:1;display:flex;flex-direction:column;justify-content:space-around}
.match{background:var(--surface);border:1px solid var(--line);border-radius:2px;overflow:hidden;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
.slot{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-radius:0;background:transparent;padding:9px 10px;font-weight:600;color:var(--ink)}
.slot+.slot{border-top:1px solid var(--line)}
.slot .n{width:22px;color:var(--muted);font-weight:400;font-size:.85rem}
.slot .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.slot:hover{background:rgba(255,46,77,.14)}
.slot.empty{color:var(--muted);font-weight:400;font-style:italic}
.slot.won{background:var(--goldbg);box-shadow:inset 4px 0 0 var(--gold)}
.slot.lost{opacity:.45;text-decoration:line-through}
.champ{background:linear-gradient(135deg,#ff2e4d,#ffc83d);color:#16060a;border-radius:4px;padding:20px 14px;text-align:center;box-shadow:0 0 40px rgba(255,46,77,.4);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.champ small{display:block;opacity:.85;text-transform:uppercase;letter-spacing:.2em;font-weight:700}
.champ strong{display:block;font-size:1.45rem;margin-top:4px;overflow-wrap:anywhere}
.champ.none{background:var(--surface);color:var(--muted);border:1px dashed var(--line);box-shadow:none}
</style>
</head>
<body>
<div id="root"></div>
<script type="application/json" id="state">{"names":["Team 1","Team 2","Team 3","Team 4","Team 5","Team 6","Team 7","Team 8","Team 9","Team 10","Team 11","Team 12"],"win":{}}</script>
<script id="app">
var state = JSON.parse(document.getElementById('state').textContent);
var names = state.names, win = state.win;
var editable = false, dirty = false;
var M = [
  {id:'r1a', r:0, a:{s:8}, b:{s:9}},
  {id:'r1b', r:0, a:{s:5}, b:{s:12}},
  {id:'r1c', r:0, a:{s:6}, b:{s:11}},
  {id:'r1d', r:0, a:{s:7}, b:{s:10}},
  {id:'q1', r:1, a:{s:1}, b:{f:'r1a'}},
  {id:'q2', r:1, a:{s:4}, b:{f:'r1b'}},
  {id:'q3', r:1, a:{s:3}, b:{f:'r1c'}},
  {id:'q4', r:1, a:{s:2}, b:{f:'r1d'}},
  {id:'s1', r:2, a:{f:'q1'}, b:{f:'q2'}},
  {id:'s2', r:2, a:{f:'q3'}, b:{f:'q4'}},
  {id:'f', r:3, a:{f:'s1'}, b:{f:'s2'}}
];
var ROUNDS = ['Round 1', 'Quarterfinals', 'Semifinals', 'Finals'];

function res(x){ return x.s ? x.s : (win[x.f] || null); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function clean(){
  M.forEach(function(m){
    var a = res(m.a), b = res(m.b), w = win[m.id];
    if (w && w !== a && w !== b) delete win[m.id];
  });
}
function slot(m, side){
  var s = res(m[side]), w = win[m.id];
  if (!s) return '<div class="slot empty"><span class="n"></span><span class="t">Waiting</span></div>';
  var both = res(m.a) && res(m.b);
  var cls = 'slot' + (w === s ? ' won' : '') + (w && w !== s ? ' lost' : '');
  var inner = '<span class="n">' + s + '</span><span class="t">' + esc(names[s-1]) + '</span>';
  if (editable && both) return '<button type="button" class="' + cls + '" data-m="' + m.id + '" data-s="' + s + '">' + inner + '</button>';
  return '<div class="' + cls + '">' + inner + '</div>';
}
function render(){
  clean();
  var h = '';
  for (var r = 0; r < 4; r++){
    h += '<div class="col"><h2>' + ROUNDS[r] + '</h2><div class="matches">';
    M.filter(function(m){ return m.r === r; }).forEach(function(m){
      h += '<div class="match">' + slot(m, 'a') + slot(m, 'b') + '</div>';
    });
    h += '</div></div>';
  }
  var c = win['f'];
  h += '<div class="col" style="flex:.8;min-width:170px"><h2>Champion</h2><div class="matches">' +
    (c ? '<div class="champ"><small>Champion</small><strong>' + esc(names[c-1]) + '</strong></div>'
       : '<div class="champ none">No champion yet</div>') + '</div></div>';
  document.getElementById('bracket').innerHTML = h;
}
function setDirty(){
  dirty = true;
  var b = document.getElementById('pub');
  if (b) b.disabled = false;
  msg('Changes are only on this screen until you upload the new file.');
}
function msg(t){ var e = document.getElementById('msg'); if (e) e.textContent = t; }

document.getElementById('root').innerHTML =
  '<main><h1>EXTERIOR MLBB TOURNAMENT</h1>' +
  '<p class="sub">12 teams · single elimination · seeds 1 to 4 get a bye in Round 1</p>' +
  '<div id="admin"></div>' +
  '<div class="scroll"><div class="bracket" id="bracket"></div></div>' +
  '<p class="note" id="orgwrap" style="margin-top:18px"><button type="button" id="org">Organizer</button></p></main>';

document.getElementById('bracket').addEventListener('click', function(e){
  var el = e.target.closest('button.slot');
  if (!editable || !el) return;
  var id = el.getAttribute('data-m'), s = +el.getAttribute('data-s');
  if (win[id] === s) delete win[id]; else win[id] = s;
  setDirty();
  render();
});

function buildAdmin(){
  var h = '<details open><summary>Organizer controls</summary>' +
    '<p class="note">Click a team in the bracket to pick the winner. Changes show only on this screen until you download the updated file and upload it to your site.</p><div class="seeds">';
  names.forEach(function(n, i){
    h += '<label class="seed"><b>' + (i+1) + '</b><input type="text" maxlength="24" data-i="' + i + '" value="' + esc(n) + '" aria-label="Seed ' + (i+1) + '"></label>';
  });
  h += '</div><div class="btns"><button type="button" id="pub" class="primary" disabled>Download updated file</button>' +
    '<button type="button" id="shuffle">Shuffle seeds</button>' +
    '<button type="button" id="reset">Reset winners</button><span class="note" id="msg"></span></div></details>';
  var a = document.getElementById('admin');
  a.innerHTML = h;
  a.addEventListener('input', function(e){
    var i = e.target.getAttribute('data-i');
    if (i === null) return;
    names[+i] = e.target.value || ('Team ' + (+i + 1));
    setDirty(); render();
  });
  document.getElementById('reset').addEventListener('click', function(){
    Object.keys(win).forEach(function(k){ delete win[k]; });
    setDirty(); render();
  });
  document.getElementById('shuffle').addEventListener('click', function(){
    for (var i = names.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = names[i]; names[i] = names[j]; names[j] = t;
    }
    Object.keys(win).forEach(function(k){ delete win[k]; });
    buildAdmin(); setDirty(); render();
  });
  document.getElementById('pub').addEventListener('click', publish);
}

function doc(){
  var st = JSON.stringify({names: names, win: win}).replace(/</g, '\\u003c');
  var S = '<scr' + 'ipt', E = '</scr' + 'ipt>';
  return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n' +
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n' +
    '<title>EXTERIOR MLBB TOURNAMENT</title>\n' +
    '<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">\n' +
    '<style id="css">' + document.getElementById('css').textContent + '</style>\n</head>\n<body>\n<div id="root"></div>\n' +
    S + ' type="application/json" id="state">' + st + E + '\n' +
    S + ' id="app">' + document.getElementById('app').textContent + E + '\n</body>\n</html>';
}
function publish(){
  var blob = new Blob([doc()], {type: 'text/html'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'index.html';
  document.body.appendChild(a); a.click(); a.remove();
  msg('Downloaded index.html. Upload it to your site to update the bracket.');
}

render();
document.getElementById('org').addEventListener('click', function(){
  editable = true;
  document.getElementById('orgwrap').remove();
  buildAdmin(); render();
});
</script>
</body>
</html>
